# This starter workflow is for a CMake project running on a single platform. There is a different starter workflow if you need cross-platform coverage.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml
name: Run tests

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install lcov
      run: sudo apt install -y lcov

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Run lcov
      if: "always()"
      run: lcov --directory ${{github.workspace}}/build --capture --output-file ${{github.workspace}}/build/coverage.info --ignore-errors mismatch --rc branch_coverage=1 --include src/storage.h

    - uses: actions/upload-artifact@v4
      if: "always()"
      with:
        name: coverage_info
        path: ${{github.workspace}}/build/coverage.info

  coverage_report:
    name: Generate coverage report
    needs: build_and_test
    runs-on: ubuntu-latest
    if: "always()"
    permissions:
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ... Generate LCOV files or download it from a different job
    - name: Setup LCOV
      uses: hrishikesh-kadam/setup-lcov@v1

    - uses: actions/download-artifact@v4
      with:
        name: coverage_info
        path: ${{github.workspace}}

    - name: Report code coverage
      uses: zgosalvez/github-actions-report-lcov@v4
      with:
        coverage-files: ${{github.workspace}}/coverage.info
        minimum-coverage: 90
        artifact-name: code-coverage-report
        github-token: ${{ secrets.GITHUB_TOKEN }}
        update-comment: true
