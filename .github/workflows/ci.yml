name: Run CI

on:
  pull_request:
    branches: [ "main" ]

env:
  BUILD_TYPE: Debug

jobs:
  build_and_test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install lcov
      run: sudo apt install -y lcov

    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}}

    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

    - name: Test
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{env.BUILD_TYPE}}

    - name: Run lcov
      if: "always()"
      run: lcov --directory ${{github.workspace}}/build --capture --output-file ${{github.workspace}}/build/coverage.info --ignore-errors mismatch --rc branch_coverage=1 --include src/storage.h

    - uses: actions/upload-artifact@v4
      if: "always()"
      with:
        name: coverage_info
        path: ${{github.workspace}}/build/coverage.info

  coverage_report:
    name: Generate coverage report
    needs: build_and_test
    runs-on: ubuntu-latest
    if: "always()"
    permissions:
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup LCOV
      uses: hrishikesh-kadam/setup-lcov@v1

    - uses: actions/download-artifact@v4
      with:
        name: coverage_info
        path: ${{github.workspace}}

    - name: Report code coverage
      uses: zgosalvez/github-actions-report-lcov@v4
      with:
        coverage-files: ${{github.workspace}}/coverage.info
        minimum-coverage: 90
        artifact-name: code-coverage-report
        github-token: ${{ secrets.GITHUB_TOKEN }}
        update-comment: true


  static_analyzer:
    name: cppcheck (Static Analyzer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
          
      - name: cppcheck
        uses: deep5050/cppcheck-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN}}
          output_file: ${{github.workspace}}/cppcheck-results.txt
          other_options: '-Isrc'

      - uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results.txt
          path: ${{github.workspace}}/cppcheck-results.txt